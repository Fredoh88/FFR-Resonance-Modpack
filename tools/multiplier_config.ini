[Multipliers]
# Multiplier for Enemy Base EXP granted (Default vanilla: 1.0, Mod default: 2.0, Max: 10.0)
EXP_MULTIPLIER = 2.0

# Multiplier for Battle Result Bonus Multiplier (Default vanilla: 1.0, Mod default: 2.0)
BATTLE_BONUS_MULTIPLIER = 2.0

# Guarantee 100% item drop chance from all defeated enemies (true / false)
DROP_RATE_100_PERCENT = true

# Guarantee 100% steal rate on all enemy items (true / false)
STEAL_RATE_100_PERCENT = true
