[SystemSettings]
; ==============================================================================
; Final Fantasy Resonance - Ultra HD Character & Pixel Clarity Profile
; ==============================================================================

; --- Aspect Ratio & FOV Handling ---
r.AspectRatioAxisConstraint=1

; --- Ultra HD Super Resolution (Internal Downsampling / Super-Sampling) ---
; Renders the 3D environments, lighting, and sprite passes at 125% internal resolution,
; eliminating jagged pixel shimmer and providing native anti-aliased edge smoothing.
r.ScreenPercentage=125

; --- Pixel Art Texture Clarity & Mip-Level Definition ---
; Forces 16x Anisotropic Filtering and a negative LOD bias (-1.0) across all 2D sprite atlases,
; pulling full-resolution sprite mip-levels to completely eliminate fuzzy/blurry pixel textures.
r.MaxAnisotropy=16
r.MipMapLodBias=-1.0

; --- Temporal Anti-Aliasing Sharpness & Zero Pixel Smearing ---
; Tightens filter sampling and boosts tonemapper sharpening (1.75) for razor-sharp pixel edges.
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=100
r.TSR.ShadingRejection.Flickering=0
r.TemporalAA.Sharpness=1.4
r.TemporalAAFilterSize=0.75
r.Tonemapper.Sharpen=1.75

; --- Optical Clarity: No Smear, No Ghosting, No Mud ---
r.DepthOfFieldQuality=0
r.MotionBlurQuality=0
r.SceneColorFringeQuality=0
r.FilmGrain=0

; --- Lighting, Dynamic Shading & HD-2D Specular Highlights ---
r.ShadowQuality=5
r.Shadow.MaxResolution=4096
r.ContactShadows=1
r.Shadow.CSM.MaxCascades=10
r.SSR.Quality=4
r.AmbientOcclusionLevels=3
r.AmbientOcclusionRadiusScale=1.2

; --- Zero Texture Streaming & Zero LOD Pop-in ---
; Forces all high-res character sprite sheets and 3D textures to load in VRAM at full quality.
r.TextureStreaming=0
r.ViewDistanceScale=2.5
r.StaticMeshLODDistanceScale=0.001

[/Script/Engine.LocalPlayer]
AspectRatioAxisConstraint=AspectRatio_MaintainYFOV
